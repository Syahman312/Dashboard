<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Morning Dashboard: a sun rising behind three bars (Flow, Money, Garage). Full-bleed; the OS rounds the corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3f7a"/>
      <stop offset=".55" stop-color="#132344"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".58" r=".55">
      <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#ff7a45" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd8ff"/><stop offset="1" stop-color="#4f8cff"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfe0ff"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ff0bd"/><stop offset="1" stop-color="#2fbf7e"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(0,-36)">
  <!-- sun -->
  <circle cx="512" cy="600" r="250" fill="url(#sun)"/>
  <!-- rays -->
  <g stroke="#ffc46b" stroke-width="26" stroke-linecap="round" opacity=".9">
    <line x1="512" y1="250" x2="512" y2="300"/>
    <line x1="290" y1="345" x2="322" y2="380"/>
    <line x1="734" y1="345" x2="702" y2="380"/>
    <line x1="192" y1="560" x2="240" y2="566"/>
    <line x1="832" y1="560" x2="784" y2="566"/>
  </g>
  <!-- horizon cut so bars sit on a clean baseline -->
  <rect x="0" y="742" width="1024" height="330" fill="#0d1526"/>
  <!-- bars with a 14px gap ring in the background colour -->
  <g stroke="#0d1526" stroke-width="20" paint-order="stroke">
    <rect x="292" y="560" width="120" height="196" rx="30" fill="url(#b1)"/>
    <rect x="452" y="440" width="120" height="316" rx="30" fill="url(#b2)"/>
    <rect x="612" y="340" width="120" height="416" rx="30" fill="url(#b3)"/>
  </g>
  <rect x="232" y="742" width="560" height="22" rx="11" fill="#e8eefc" opacity=".9"/>
  </g>
</svg>
