.health-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.seg-ctl { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg-ctl button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; color: var(--muted); transition: background .15s, color .15s; }
.seg-ctl button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.issue { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 4px 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.issue:first-of-type { border-top: 0; }
.issue .dot { margin-top: 7px; }
.issue .m { font-size: 14px; overflow-wrap: anywhere; }
.issue .d { grid-column: 2; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.issue .a { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; margin-right: 6px; }
.issue .acts { grid-column: 2; display: flex; gap: 14px; font-size: 12.5px; margin-top: 2px; }
.issue .acts a, .linkbtn { color: var(--accent); text-decoration: none; background: none; border: 0; padding: 0; font-size: 12.5px; cursor: pointer; }
.linkbtn.faint { color: var(--faint); }

.issue.rec .m { color: var(--muted); }
.fixbox { grid-column: 2; margin-top: 6px; }
.fixbox summary { cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 6px; }
.fixbox summary::-webkit-details-marker { display: none; }
.fixbox summary::before { content: "▸"; font-size: 10px; transition: transform .15s; }
.fixbox[open] summary::before { transform: rotate(90deg); }
.fixbox ol { margin: 8px 0 4px; padding-left: 20px; font-size: 13.5px; color: var(--text); }
.fixbox li { margin: 4px 0; }
.where { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--muted); margin-left: 6px; }
.where.app { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.where.sheet { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.issue .acts a.open-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 8px; background: var(--accent); color: var(--accent-ink) !important; font-size: 12.5px; font-weight: 600; text-decoration: none; }
#toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; transition: opacity .2s, transform .2s; background: var(--card-3); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.3); border-radius: 12px; padding: 10px 16px; font-size: 14px; max-width: calc(100vw - 32px); pointer-events: none; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 680px) { #toast { bottom: calc(84px + env(safe-area-inset-bottom)); } }
.fresh { font-size: 11.5px; font-weight: 550; padding: 3px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.fresh .dot { width: 6px; height: 6px; }
.banner { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); margin-top: 14px; font-size: 13.5px; color: var(--muted); }
.banner.err { border-color: var(--bad); color: var(--text); }
.skel { height: 180px; border-radius: var(--radius); background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
/* First-run setup (home-screen app) */
.setup { max-width: 460px; margin: 28px auto 0; text-align: center; }
.setup .logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
.setup h2 { font-size: 24px; margin: 16px 0 4px; letter-spacing: -.02em; }
.setup form { text-align: left; margin-top: 18px; }
.setup label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.setup input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.setup input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { display: block; width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 650; cursor: pointer; }
.err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 1em; }
.setup-mode .bnav, .setup-mode .tabs, .setup-mode .hdr-r { display: none !important; }
.hint { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
/* Large PC screens: use the space */
@media (min-width: 1600px) {
  .wrap, .top-in { max-width: 1480px; }
  body { font-size: 15.5px; }
}
/* Touch screens: every tap target at least 44px tall */
@media (pointer: coarse) {
  .pill, .seg-ctl button, .icon-btn, .mpick button, .issue .acts a.open-btn, .issue .acts .pill { min-height: 44px; }
  .icon-btn { min-width: 44px; justify-content: center; }
  .mpick button { width: 44px; }
  .pill { padding: 0 14px; }
  .seg-ctl button { padding: 0 14px; }
  .linkbtn { min-height: 44px; display: inline-flex; align-items: center; padding: 0 6px; }
  .fixbox summary { min-height: 44px; }
  .legend button { min-height: 36px; }
  .issue .acts { gap: 10px; }
  .brief li { min-height: 48px; }
}
/* Phones turned sideways: keep the header slim */
@media (max-height: 500px) and (orientation: landscape) {
  .top-in { padding-top: max(8px, env(safe-area-inset-top)); }
  .hdr .sub, .stamp { display: none; }
  .hdr h1 { font-size: 18px; }
  .tabs { margin-top: 2px; }
  .tab { padding: 8px 12px 9px; }
  .icon-btn { height: 34px; min-height: 34px; }
  .view { padding-top: 12px; }
}
/* 16px text in fields stops iPhone zooming in when you tap them */
input, select, textarea { font-size: 16px !important; }
/* Pull to refresh (home-screen app) */
#ptr { position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 8px); z-index: 40; transform: translate(-50%, -60px); width: 36px; height: 36px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--accent); transition: transform .2s; }
#ptr svg { width: 18px; height: 18px; }
#ptr.spin svg { animation: spin .9s linear infinite; }
.kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
footer { margin-top: 28px; padding-bottom: 56px; color: var(--faint); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
footer a { color: var(--muted); }
</style>
</head>

<div id="banner"></div>

</div>

  <section class="view" data-view="garage"><div class="wrap" id="v-garage"></div><footer class="foot wrap"></footer></section>
  <section class="view" data-view="health"><div class="wrap" id="v-health"></div><footer class="foot wrap"></footer></section>
</main>

<nav class="bnav" id="bnav" aria-label="Sections"></nav>
<div id="tip" role="status" aria-live="polite"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>

  /**

  /* =========================================================

    pager.scrollLeft = viewIndex(S.view) * pageWidth();
  }

  /* =========================================================
   * Building blocks
   * ======================================================= */
  function freshBadge(src) {
    if (!src || !src.ok || !src.summary || !('lastChange' in src.summary)) return '';
    var lc = src.summary.lastChange, now = S.data.generatedAt;
    var age = lc ? (now - lc) / 3600e3 : Infinity;
    var tone = age < 24 ? 'ok' : age < 72 ? 'warn' : 'error';
    return '<span class="fresh" title="Last time the app saved to its sheet"><span class="dot ' + tone + '"></span>' + (lc ? 'Saved ' + rel(lc, now) : 'No saves seen') + '</span>';
  }
  function cardHead(title, sub, right) {
    return '<div class="card-h"><div><h2>' + title + '</h2>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (right ? '<div style="display:flex;gap:10px;align-items:center">' + right + '</div>' : '') + '</div>';
  }
  function tile(v, l, s, cls, attrs) {
    return '<div class="tile"><div class="v num ' + (cls || '') + '"' + (attrs || '') + '>' + v + '</div><div class="l">' + l + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  }
  function failedCard(name, src) {
    return '<div class="card"><div class="note bad"><b>Could not read the ' + esc(name) + ' sheet.</b><br>' + esc(src && src.error) + '</div></div>';
  }
  function viewHeader(title, src) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;font-size:22px;letter-spacing:-.02em">' + title + '</h2>' + freshBadge(src) + '</div>' +
      '<div class="chip-row">' + appButton(src) + (src && src.url ? '<a class="pill" href="' + esc(src.url) + '" target="_blank" rel="noopener">Open sheet ↗</a>' : '') + '</div></div>';
  }
  /** "Open Flow app" — or, until its link is set, a button that explains how to add it. */
  function appButton(src, small) {
    if (!src) return '';
    if (src.appUrl) return '<a class="' + (small ? 'open-btn' : 'pill app-pill') + '" href="' + esc(src.appUrl) + '" target="_blank" rel="noopener">Open ' + esc(src.name) + ' app ↗</a>';
    if (small) return '';
    return '<button type="button" class="pill" data-applink="' + esc(src.appProp || '') + '" data-appname="' + esc(src.name) + '">+ Link ' + esc(src.name) + ' app</button>';
  }
  function bindAppLinks(root) {
    each(root, '[data-applink]', function (b) {
      b.addEventListener('click', function () {
        toast('Add the ' + b.getAttribute('data-appname') + ' app\'s address in Apps Script → Project Settings → Script Properties as ' + b.getAttribute('data-applink') + ', then press Refresh.', 9000);
      });
    });
  }
  function taskLi(t, mode) {
    var right = mode === 'late' ? '<span class="tag late">' + shortDate(t.date) + '</span>'
      : mode === 'date' ? '<span class="r">' + dayName(t.date) + ' ' + shortDate(t.date) + '</span>'
      : (t.time ? '<span class="r num">' + esc(t.time) + '</span>' : '');
    return '<li><span class="t">' + esc(t.task) + (t.top3 ? '<span class="tag t3">Top 3</span>' : '') + '</span>' + right + '</li>';
  }
  function bindGo(root) {
    each(root, '[data-go]', function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-go'), { filter: b.getAttribute('data-f') }); });
    });
  }

  /* =========================================================
   * Overview
   * ======================================================= */
  function viewOverview(host, d) {
    var c = counts(d), brief = d.brief || [], up = d.upcoming || [];
    var ICONS = { bad: '!', warn: '•', good: '✓', info: 'i' };
    var goLink = function (label) { return '<span class="go">Open ' + label + ' ' + svgIcon('arrow', 14) + '</span>'; };
    var html = '<div class="chip-row" style="margin-bottom:14px">';
    if (!c.error && !c.warn) html += '<span class="pill"><span class="dot ok"></span>All three apps look healthy</span>';
    if (c.error) html += '<button class="pill" type="button" data-go="health" data-f="error"><span class="dot error"></span>' + plural(c.error, 'error') + '</button>';
    if (c.warn) html += '<button class="pill" type="button" data-go="health" data-f="warn"><span class="dot warn"></span>' + plural(c.warn, 'warning') + '</button>';
    if (c.info) html += '<button class="pill" type="button" data-go="health" data-f="info"><span class="dot info"></span>' + c.info + ' to tidy up</button>';
    html += '</div>';

    html += '<div class="grid g-21">';
    html += '<div class="card">' + cardHead('Morning brief', 'What matters today, across all apps') + '<ul class="brief">' +
      (brief.length ? brief.map(function (b) {
        return '<li class="' + esc(b.tone) + '" data-go="' + (SRC_VIEW[b.src] || 'overview') + '" title="Open ' + esc(SRC_LABEL[b.src] || '') + '"><span class="ic">' + (ICONS[b.tone] || 'i') + '</span><span>' + esc(b.text) + '</span><span class="src">' + esc(SRC_LABEL[b.src] || '') + '</span></li>';
      }).join('') : '<li class="good"><span class="ic">✓</span><span>All quiet.</span><span></span></li>') + '</ul></div>';
    html += '<div class="card">' + cardHead('Coming up', 'Next 45 days') + '<ul class="list up">' +
      (up.length ? up.map(function (u) {
        var when = u.days === 0 ? 'Today' : u.days === 1 ? 'Tomorrow' : shortDate(u.date);
        return '<li><span class="t"><span class="when' + (u.days <= 7 ? ' soon' : '') + '">' + when + '</span>' + esc(u.label) + '</span><span class="r">' + (u.days > 1 ? 'in ' + u.days + 'd' : '') + '</span></li>';
      }).join('') : '<li class="empty">Nothing dated in the next 45 days.</li>') + '</ul></div>';
    html += '</div>';

    html += '<div class="grid g3" style="margin-top:14px">';
    var fl = d.sources.flow, fi = d.sources.finance, ga = d.sources.garage, s1 = css('--s1');
    if (fl && fl.ok) {
      var tk = fl.summary.tasks, st = fl.summary.study;
      html += '<button type="button" class="card sum" data-go="flow"><div class="row"><span class="eyebrow">Today · Flow</span>' + freshBadge(fl) + '</div>' +
        '<div class="row"><div><div class="big num">' + tk.today.length + ' <span style="font-size:15px;font-weight:500" class="muted">due today</span></div>' +
        '<div class="muted" style="font-size:13px">' + (tk.overdueCount ? '<span class="bad">' + tk.overdueCount + ' overdue</span> · ' : '') + tk.doneToday + ' done</div></div>' +
        sparkline(st.daily.slice(-14).map(function (x) { return x.minutes; }), s1) + '</div>' +
        '<div class="faint" style="font-size:12px;margin-top:6px">Study, last 14 days · ' + mins(st.week) + ' this week</div>' + goLink('Flow') + '</button>';
    } else html += failedCard('Flow', fl);
    if (fi && fi.ok && fi.summary.month) {
      var m = fi.summary.month, diff = m.spent - m.prevSamePoint, run = 0;
      var cum = ((fi.summary.daily || {}).cur || []).map(function (v) { run += v; return run; });
      html += '<button type="button" class="card sum" data-go="money"><div class="row"><span class="eyebrow">Money · ' + monLabel(m.month) + '</span>' + freshBadge(fi) + '</div>' +
        '<div class="row"><div><div class="big num" data-count="' + m.spent + '" data-fmt="rm0">' + rm(m.spent, 0) + '</div>' +
        '<div style="font-size:13px"><span class="delta ' + (diff > 0 ? 'bad' : 'good') + '">' + (diff > 0 ? '▲' : '▼') + ' ' + rm(Math.abs(diff), 0) + '</span> <span class="faint">vs last month</span></div></div>' +
        sparkline(cum, s1) + '</div>' +
        '<div class="faint" style="font-size:12px;margin-top:6px">Spent so far' + (m.projected ? ' · on pace for ' + rm(m.projected, 0) : '') + '</div>' + goLink('Money') + '</button>';
    } else html += failedCard('Finance', fi);
    if (ga && ga.ok && ga.summary.cars.length) {
      var car = ga.summary.cars[0], rt = car.renewals[0];
      html += '<button type="button" class="card sum" data-go="garage"><div class="row"><span class="eyebrow">' + esc(car.name) + ' · Garage</span>' + freshBadge(ga) + '</div>' +
        '<div class="row"><div><div class="big num ' + (rt && rt.daysLeft <= 30 ? 'warnc' : '') + '">' + (rt ? (rt.daysLeft < 0 ? 'Expired' : rt.daysLeft + ' days') : fmtNum(car.odo) + ' km') + '</div>' +
        '<div class="muted" style="font-size:13px">' + (rt ? esc(rt.label) + ' · ' + shortDate(rt.date) : '') + '</div></div>' +
        sparkline((car.monthly || []).map(function (x) { return x.fuel; }), s1) + '</div>' +
        '<div class="faint" style="font-size:12px;margin-top:6px">Fuel, last 12 months · ' + rm(car.fuel.monthCost, 0) + ' this month</div>' + goLink('Garage') + '</button>';
    } else html += failedCard('Garage', ga);
    html += '</div>';

    // Quick launcher for the apps themselves
    html += '<div class="card" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<div><h2 style="font-size:15px;margin:0">Open your apps</h2><div class="faint" style="font-size:12.5px">Jump straight into an app to add or fix something</div></div>' +
      '<div class="chip-row">' + ['flow', 'finance', 'garage'].map(function (k) { return appButton(d.sources[k]); }).join('') + '</div></div>';

    host.innerHTML = html;
    bindGo(host);
  }

  /* =========================================================
   * Money
   * ======================================================= */
  function viewMoney(host, d) {
    var src = d.sources.finance;
    if (!src || !src.ok) { host.innerHTML = failedCard('Finance', src); return; }
    var s = src.summary, m = s.month, html = viewHeader('Money', src);

    if (m) {
      var diff = m.spent - m.prevSamePoint;
      html += '<div class="grid g-12">';
      html += '<div class="card"><div class="eyebrow">Spent in ' + monLabel(m.month, true) + '</div>' +
        '<div class="hero num" style="margin-top:8px" data-count="' + m.spent + '">' + rm(m.spent) + '</div>' +
        '<div class="hero-sub"><span class="delta ' + (diff > 0 ? 'bad' : 'good') + '">' + (diff > 0 ? '▲ ' : '▼ ') + rm(Math.abs(diff)) + '</span> vs the same day last month</div>' +
        '<div class="tiles" style="margin-top:16px">' +
          tile(rm(m.today), 'Spent today') +
          tile(m.projected ? rm(m.projected, 0) : '—', 'On pace for', 'by month end') +
          tile(rm(m.income, 0), 'Income this month') +
          tile(rm(m.prevSpent, 0), 'All of last month') +
        '</div></div>';
      html += '<div class="card">' + cardHead('This month vs last month', 'Running total by day · hover, tap or use ← →') + '<div id="lg-cum"></div><div id="ch-cum"></div></div>';
      html += '</div>';
    }

    html += '<div class="grid g-21" style="margin-top:14px">';
    html += '<div class="card">' + cardHead('Last 12 months', 'Click a month to see where the money went') + '<div id="lg-12"></div><div id="ch-12"></div></div>';
    html += '<div class="card"><div class="card-h"><div><h2>Where it went</h2><div class="sub" id="cat-sub"></div></div>' +
      '<div class="mpick"><button type="button" id="mp-prev" aria-label="Previous month">' + svgIcon('left') + '</button><span id="mp-lbl"></span><button type="button" id="mp-next" aria-label="Next month">' + svgIcon('right') + '</button></div></div>' +
      '<div id="cats"></div></div>';
    html += '</div>';

    var gr = s.groups || { liquid: 0, savings: 0, debt: 0 };
    var assets = gr.liquid + gr.savings, scaleMax = Math.max(assets, gr.debt, 1);
    html += '<div class="grid g3" style="margin-top:14px">';
    html += '<div class="card">' + cardHead('Net worth', 'What you have minus what you owe') +
      '<div class="hero num" style="font-size:32px" data-count="' + s.netWorth + '" data-fmt="rm0">' + rm(s.netWorth, 0) + '</div>' +
      '<h3 class="sec">Assets · ' + rm(assets, 0) + '</h3>' +
      '<div class="seg" style="width:' + (assets / scaleMax * 100).toFixed(1) + '%"><i style="flex-grow:' + gr.liquid + ';background:var(--s1)" title="Cash &amp; bank ' + rm(gr.liquid, 0) + '"></i><i style="flex-grow:' + gr.savings + ';background:var(--s2)" title="Savings &amp; investments ' + rm(gr.savings, 0) + '"></i></div>' +
      '<div class="legend" style="margin:8px 0 0"><button type="button" disabled><span class="key" style="background:var(--s1)"></span>Cash &amp; bank · ' + rm(gr.liquid, 0) + '</button><button type="button" disabled><span class="key" style="background:var(--s2)"></span>Savings &amp; investments · ' + rm(gr.savings, 0) + '</button></div>' +
      '<h3 class="sec">Owed · ' + rm(gr.debt, 0) + '</h3>' +
      '<div class="seg" style="width:' + (gr.debt / scaleMax * 100).toFixed(1) + '%"><i style="flex-grow:1;background:var(--s-prev)"></i></div>' +
      '<ul class="list" style="margin-top:8px">' + (s.debts || []).slice(0, 5).map(function (a) {
        return '<li><span class="t">' + esc(a.name) + '<span class="tag">' + esc(a.type) + '</span></span><span class="r num">' + rm(a.owed) + '</span></li>';
      }).join('') + '</ul></div>';

    var groupsOrder = [['liquid', 'Cash & bank'], ['savings', 'Savings & investments'], ['debt', 'Owed']];
    html += '<div class="card">' + cardHead('Accounts', plural((s.accounts || []).length, 'account')) + '<table class="tbl"><tbody>' +
      groupsOrder.map(function (g) {
        var rows = (s.accounts || []).filter(function (a) { return a.group === g[0]; });
        if (!rows.length) return '';
        var val = function (a) { return g[0] === 'debt' ? (a.owed || 0) : (a.balance || 0); };
        rows.sort(function (a, b) { return val(b) - val(a); });
        return '<tr class="grp"><td>' + g[1] + '</td><td class="n">' + rm(rows.reduce(function (t, a) { return t + val(a); }, 0), 0) + '</td></tr>' + rows.map(function (a) {
          return '<tr><td>' + esc(a.name) + '</td><td class="n">' + rm(val(a)) + '</td></tr>';
        }).join('');
      }).join('') + '</tbody></table></div>';

    html += '<div class="card">' + cardHead('Recent transactions', 'Latest ' + (s.recent || []).length) + '<ul class="list">' +
      (s.recent || []).map(function (t) {
        var inflow = t.amount > 0 && !t.transfer;
        return '<li><span class="t"><span class="when">' + shortDate(t.date) + '</span>' + esc(t.desc || t.cat || '—') +
          '<div class="faint" style="font-size:12px;margin-left:62px;overflow:hidden;text-overflow:ellipsis">' + esc(t.cat || (t.transfer ? 'Transfer' : 'No category')) + ' · ' + esc(t.account) + '</div></span>' +
          '<span class="num ' + (inflow ? 'good' : '') + '" style="font-size:14px;white-space:nowrap">' + (t.amount > 0 ? '+' : '') + rm(t.amount) + '</span></li>';
      }).join('') + '</ul></div>';
    html += '</div>';

    host.innerHTML = html;
    var firstPaint = S.animate;

    // Running total, this month vs last month
    if (m && s.daily) {
      var cumulate = function (arr) { var t = 0; return arr.map(function (v) { t += v; return Math.round(t * 100) / 100; }); };
      var cur = cumulate(s.daily.cur), prev = cumulate(s.daily.prev);
      var n = Math.max(s.daily.daysInMonth, prev.length), labels = [];
      for (var i = 1; i <= n; i++) labels.push(String(i));
      var cs = [
        { name: monLabel(s.daily.month), values: cur, color: css('--s1'), area: true },
        { name: monLabel(s.daily.prevMonth), values: prev, color: css('--s-prev'), dash: true }
      ];
      $('lg-cum').appendChild(legend([{ name: cs[0].name, color: cs[0].color, line: true }, { name: cs[1].name, color: cs[1].color, line: true, dash: true }], 'cum'));
      lineChart($('ch-cum'), {
        labels: labels, series: cs, yFmt: rmK, tipFmt: function (v) { return rm(v); }, height: 250,
        aria: 'Running total of spending this month compared with last month',
        xTitle: function (i) { return 'Day ' + (i + 1) + ' of the month'; },
        extra: function (i) {
          if (cur[i] === undefined || prev[i] === undefined) return null;
          var dl = cur[i] - prev[i];
          return [(dl > 0 ? rm(dl) + ' more' : rm(-dl) + ' less') + ' than ' + cs[1].name + ' at this point'];
        }
      });
    }

    var tr = s.trend || [], months = tr.map(function (t) { return t.month; });
    function draw12() {
      var sel = months.indexOf(S.moneyMonth);
      var sr = [
        { name: 'Spending', values: tr.map(function (t) { return t.spent; }), color: css('--s1'), off: S.legendOff['m12:Spending'] },
        { name: 'Income', values: tr.map(function (t) { return t.income; }), color: css('--s2'), off: S.legendOff['m12:Income'] }
      ];
      $('lg-12').textContent = '';
      $('lg-12').appendChild(legend(sr.map(function (x) { return { name: x.name, color: x.color }; }), 'm12', function () { S.animate = false; draw12(); }));
      barChart($('ch-12'), {
        labels: tr.map(function (t) { return monLabel(t.month); }), series: sr, yFmt: rmK, tipFmt: function (v) { return rm(v); },
        height: 260, selected: sel < 0 ? null : sel, aria: 'Spending and income for the last 12 months. Use left and right arrows to change month.',
        xTitle: function (i) { return monLabel(tr[i].month, true); },
        extra: function (i) { var net = tr[i].income - tr[i].spent; return ['Net ' + (net >= 0 ? '+' : '−') + rm(Math.abs(net)), S.moneyMonth === tr[i].month ? 'Showing its categories →' : 'Click to see categories']; },
        onSelect: pickMonth
      });
    }
    function pickMonth(i) {
      if (i < 0 || i >= months.length) return;
      S.moneyMonth = months[i]; S.animate = false;
      draw12(); drawCats(true);
    }
    function drawCats(grow) {
      var mk = S.moneyMonth || months[months.length - 1], idx = months.indexOf(mk);
      var rows = (s.catsByMonth || {})[mk] || [];
      var total = rows.reduce(function (t, r) { return t + r.spent; }, 0);
      $('mp-lbl').textContent = monLabel(mk) + ' ’' + mk.slice(2, 4);
      $('cat-sub').textContent = rows.length ? rm(total) + ' · ' + plural(rows.reduce(function (k, r) { return k + r.count; }, 0), 'transaction') : '';
      $('mp-prev').disabled = idx <= 0; $('mp-next').disabled = idx >= months.length - 1;
      var top = rows.length ? rows[0].spent : 1;
      $('cats').innerHTML = rows.length ? rows.map(function (r, i) {
        var pct = total ? Math.round(r.spent / total * 100) : 0, w = (r.spent / top * 100).toFixed(1) + '%';
        return '<div class="hb' + (r.other ? ' other' : '') + '" data-i="' + i + '"><div class="hb-top"><span class="hb-name">' + esc(r.category) + '</span><span class="hb-val"><b class="num">' + rm(r.spent) + '</b> · ' + pct + '%</span></div>' +
          '<div class="hb-track"><i ' + (grow ? 'data-w="' + w + '"' : 'style="width:' + w + '"') + '></i></div></div>';
      }).join('') : '<div class="empty">No spending recorded in ' + monLabel(mk, true) + '.</div>';
      each($('cats'), '.hb', function (e) {
        var r = rows[+e.getAttribute('data-i')];
        e.addEventListener('pointerdown', function (evt) { e.dispatchEvent(new PointerEvent('pointermove', evt)); });
        e.addEventListener('pointermove', function (evt) {
          showTip(evt.clientX, evt.clientY, r.category, [{ color: css(r.other ? '--s-prev' : '--s1'), value: rm(r.spent), label: monLabel(mk, true) }],
            [plural(r.count, 'transaction') + ' · average ' + rm(r.spent / Math.max(1, r.count)), Math.round(r.spent / total * 100) + '% of the month']);
        });
        e.addEventListener('pointerleave', mouseLeave);
      });
      if (grow) fillBars($('cats'));
    }
    $('mp-prev').addEventListener('click', function () { pickMonth(months.indexOf(S.moneyMonth) - 1); });
    $('mp-next').addEventListener('click', function () { pickMonth(months.indexOf(S.moneyMonth) + 1); });
    S.animate = firstPaint;
    draw12();
    drawCats(true);
  }

  /* =========================================================

      (s.close ? '<h3 class="sec">Month-end close · ' + esc(s.close.period) + '</h3><div class="prog"><i data-w="' + Math.round(s.close.done / s.close.total * 100) + '%"></i></div>' +
        '<div class="faint num" style="font-size:12.5px;margin-top:6px">' + s.close.done + ' of ' + s.close.total + ' done' + (s.close.behind ? ' · <span class="bad">' + s.close.behind + ' behind</span>' : '') + '</div>' +
        '<ul class="list" style="margin-top:6px">' + s.close.nextItems.map(function (it) { return '<li><span class="t">' + esc(it.task) + '</span><span class="r">' + (it.wd !== null ? 'WD' + it.wd : '') + '</span></li>'; }).join('') + '</ul>' : '') + '</div>';
    html += '</div>';

    html += '<div class="grid g-21" style="margin-top:14px">';
    html += '<div class="card">' + cardHead('Study time', 'Per day, last 30 days · ' + mins((st.daily || []).reduce(function (t, x) { return t + x.minutes; }, 0)) + ' total') + '<div id="ch-study"></div></div>';
    html += '<div class="card">' + cardHead('ACCA papers', (st.papers || []).length ? plural(st.papers.length, 'paper') : '') +
      ((st.papers || []).length ? st.papers.map(function (p, i) {
        var pct = p.targetHours ? Math.min(100, Math.round(p.hours / p.targetHours * 100)) : 0;
        var soon = p.daysLeft !== null && p.daysLeft >= 0 && p.daysLeft <= 30;
        return '<div style="padding:9px 0;' + (i ? 'border-top:1px solid var(--line)' : '') + '"><div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><div style="min-width:0"><b>' + esc(p.code) + '</b> <span class="muted" style="font-size:13.5px">' + esc(p.paper) + '</span></div>' +
          '<span class="num ' + (soon ? 'warnc' : 'faint') + '" style="font-size:13px;white-space:nowrap">' + (p.daysLeft === null ? '' : p.daysLeft < 0 ? 'sat ' + shortDate(p.exam) : p.daysLeft + ' days') + '</span></div>' +
          (p.targetHours ? '<div class="prog blue" style="margin-top:8px"><i data-w="' + pct + '%"></i></div>' : '') +
          '<div class="faint num" style="font-size:12px;margin-top:5px">' + p.hours + (p.targetHours ? ' of ' + p.targetHours : '') + ' h' + (p.confidence !== null ? ' · confidence ' + p.confidence + '/3' : '') + (p.status ? ' · ' + esc(p.status) : '') + '</div></div>';
      }).join('') : '<div class="empty">No papers yet.</div>') + '</div>';
    html += '</div>';

    html += '<div class="card" style="margin-top:14px">' + cardHead('Habits', 'Last 5 weeks · today is outlined') +
      ((s.habits || []).length ? s.habits.map(function (h, hi) {
        var cells = (h.days || []).map(function (on, i) {
          var iso = addDaysIso(d.today, i - (h.days.length - 1));
          return '<i class="' + (on ? 'on' : '') + (i === h.days.length - 1 ? ' today' : '') + '" data-h="' + hi + '" data-d="' + iso + '" data-on="' + on + '"></i>';
        }).join('');
        return '<div class="hab"><div class="hab-name">' + esc(h.icon) + ' ' + esc(h.habit) + '</div><div class="cells">' + cells + '</div>' +
          '<div class="hab-meta num">' + h.week + '/' + h.target + ' this week' + (h.streak ? ' · ' + h.streak + '-day streak' : '') + '</div></div>';
      }).join('') : '<div class="empty">No habits yet.</div>') + '</div>';

    host.innerHTML = html;
    each(host, '.cells i', function (c) {
      c.addEventListener('pointerdown', function (evt) { c.dispatchEvent(new PointerEvent('pointermove', evt)); });
      c.addEventListener('pointermove', function (evt) {
        var h = s.habits[+c.getAttribute('data-h')], iso = c.getAttribute('data-d'), on = c.getAttribute('data-on') === '1';
        showTip(evt.clientX, evt.clientY, dayName(iso) + ', ' + shortDate(iso), [{ color: css(on ? '--good' : '--faint'), value: on ? 'Done' : 'Not done', label: h.habit }]);
      });
      c.addEventListener('pointerleave', mouseLeave);
    });
    var daily = st.daily || [];
    barChart($('ch-study'), {
      labels: daily.map(function (x) { return String(parseIso(x.date).getUTCDate()); }),
      series: [{ name: 'Study', values: daily.map(function (x) { return x.minutes; }), color: css('--s1') }],
      yFmt: function (v) { return v >= 60 ? Math.round(v / 6) / 10 + 'h' : Math.round(v) + 'm'; },
      tipFmt: mins, height: 220, aria: 'Study time per day for the last 30 days',
      xTitle: function (i) { return dayName(daily[i].date) + ', ' + shortDate(daily[i].date); }
    });
  }

  /* =========================================================
   * Garage
   * ======================================================= */
  function viewGarage(host, d) {
    var src = d.sources.garage;
    if (!src || !src.ok) { host.innerHTML = failedCard('Garage', src); return; }
    var cars = src.summary.cars, html = viewHeader('Garage', src);
    if (!cars.length) { host.innerHTML = html + '<div class="card"><div class="empty">No car in the sheet yet.</div></div>'; return; }
    cars.forEach(function (c, ci) {
      var t = c.totals || {};
      html += '<div class="card" style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap">' +
        '<div><div class="eyebrow">' + esc(c.year) + ' · ' + esc(c.plate) + '</div><div class="hero" style="font-size:32px;margin-top:4px">' + esc(c.name) + '</div></div>' +
        '<div class="num" style="font-size:22px;font-weight:650;color:var(--muted)"><span data-count="' + (c.odo || 0) + '" data-fmt="int">' + fmtNum(c.odo) + '</span> km</div></div>' +
        '<div class="tiles" style="margin-top:16px">' +
        c.renewals.map(function (r) {
          return tile(r.daysLeft < 0 ? 'Expired' : r.daysLeft + ' days', esc(r.label), shortDate(r.date) + ' ' + r.date.slice(0, 4), r.daysLeft < 0 ? 'bad' : r.daysLeft <= 30 ? 'warnc' : '');
        }).join('') +
        tile(c.fuel.economy ? c.fuel.economy.kmPerL + ' km/L' : '—', 'Fuel economy', c.fuel.economy ? 'last ' + c.fuel.economy.fills + ' fills' : '') +
        tile(c.fuel.economy ? 'RM ' + c.fuel.economy.rmPerKm.toFixed(2) : '—', 'Fuel cost per km') +
        tile(rm(c.fuel.monthCost, 0), 'Fuel this month', rm(c.fuel.last30Cost, 0) + ' in the last 30 days') +
        tile(rm((t.fuel12 || 0) + (t.service12 || 0), 0), 'Running cost, 12 months', t.km12 ? fmtNum(t.km12) + ' km driven' : '') +
        '</div></div>';

      html += '<div class="grid g-21" style="margin-bottom:14px">';
      html += '<div class="card">' + cardHead('Running costs', 'Fuel and servicing per month · hover for litres and km') + '<div id="lg-run-' + ci + '"></div><div id="ch-run-' + ci + '"></div></div>';
      html += '<div class="card">' + cardHead('Longest since done', 'Service items') +
        (c.services.length ? '<ul class="list">' + c.services.map(function (x) {
          return '<li><span class="t">' + esc(x.item) + '</span><span class="r num">' + (x.kmSince !== null ? fmtNum(x.kmSince) + ' km ago' : shortDate(x.date) + ' ' + x.date.slice(0, 4)) + '</span></li>';
        }).join('') + '</ul>' : '<div class="empty">No services logged.</div>') +
        (c.fuel.lastFill ? '<div class="note" style="margin-top:12px">Last fill ' + shortDate(c.fuel.lastFill.date) + ' · ' + rm(c.fuel.lastFill.cost) + (c.fuel.lastFill.litres ? ' · ' + c.fuel.lastFill.litres + ' L' : '') + (c.fuel.lastFill.place ? ' at ' + esc(c.fuel.lastFill.place) : '') + '</div>' : '') + '</div>';
      html += '</div>';

      html += '<div class="card" style="margin-bottom:14px">' + cardHead('Service history', (c.history || []).length ? 'Most recent first' : '') +
        ((c.history || []).length ? '<ul class="tl">' + c.history.map(function (h) {
          return '<li><div class="d num">' + shortDate(h.date) + ' ' + h.date.slice(0, 4) + (h.odo ? ' · ' + fmtNum(h.odo) + ' km' : '') + (h.cost !== null ? ' · ' + rm(h.cost) : '') + '</div><div class="i">' + esc(h.items.join(', ')) + '</div></li>';
        }).join('') + '</ul>' : '<div class="empty">No services logged.</div>') + '</div>';
    });
    host.innerHTML = html;

    var firstPaint = S.animate;
    cars.forEach(function (c, ci) {
      var mo = c.monthly || [];
      function drawRun() {
        var sr = [
          { name: 'Fuel', values: mo.map(function (x) { return x.fuel; }), color: css('--s1'), off: S.legendOff['run' + ci + ':Fuel'] },
          { name: 'Service', values: mo.map(function (x) { return x.service; }), color: css('--s2'), off: S.legendOff['run' + ci + ':Service'] }
        ];
        $('lg-run-' + ci).textContent = '';
        $('lg-run-' + ci).appendChild(legend(sr.map(function (x) { return { name: x.name, color: x.color }; }), 'run' + ci, function () { S.animate = false; drawRun(); }));
        barChart($('ch-run-' + ci), {
          labels: mo.map(function (x) { return monLabel(x.month); }), series: sr, stacked: true, yFmt: rmK, tipFmt: function (v) { return rm(v); },
          height: 250, aria: 'Fuel and service cost per month for the last 12 months',
          xTitle: function (i) { return monLabel(mo[i].month, true); },
          extra: function (i) {
            var x = mo[i], out = ['Total ' + rm(x.fuel + x.service) + (x.fills ? ' · ' + plural(x.fills, 'fill') + ', ' + x.litres + ' L' : '')];
            if (x.km) out.push(fmtNum(x.km) + ' km driven' + (x.fuel ? ' · RM ' + (x.fuel / x.km).toFixed(2) + ' per km' : ''));
            return out;
          }
        });
      }
      S.animate = firstPaint;
      drawRun();
    });
  }

  /* =========================================================
   * Health
   * ======================================================= */
  function viewHealth(host, d) {
    var filters = [['problems', 'To fix'], ['error', 'Errors'], ['warn', 'Warnings'], ['info', 'Tidy-ups'], ['all', 'All']];
    var keep = function (i) { return S.filter === 'all' || (S.filter === 'problems' ? i.level !== 'info' : i.level === S.filter); };
    var visible = visibleIssues(d), hiddenCount = d.issues.length - visible.length, c = counts(d);
    var bySrc = { flow: [], finance: [], garage: [] };
    visible.filter(keep).forEach(function (i) { (bySrc[i.source] = bySrc[i.source] || []).push(i); });
    var WHERE = { app: function (i) { return 'Fix in ' + (SRC_LABEL[i.source] === 'Money' ? 'Finance' : SRC_LABEL[i.source] || 'the app'); }, sheet: function () { return 'Fix in the sheet'; }, none: function () { return 'Nothing to edit'; } };
    var html = '<div class="health-head"><div><h2 style="margin:0;font-size:22px;letter-spacing:-.02em">Health check</h2>' +
      '<div class="muted" style="font-size:13px;margin-top:2px">' + plural(c.error, 'error') + ' · ' + plural(c.warn, 'warning') + ' · ' + c.info + ' tidy-ups. Open a problem, fix it, then press Recheck.</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><div class="seg-ctl" role="group" aria-label="Filter issues">' + filters.map(function (f) {
        return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (S.filter === f[0]) + '">' + f[1] + '</button>';
      }).join('') + '</div><button type="button" class="icon-btn" id="recheck">' + svgIcon('refresh') + 'Recheck</button></div></div>';
    html += '<div class="grid g3" style="align-items:start">' + Object.keys(bySrc).map(function (k) {
      var list = bySrc[k];
      if (k === 'cross' && !list.length) return '';
      var body = list.length ? list.map(function (i, n) {
        var s = d.sources[i.source] || {};
        var link = i.ref && s.url ? s.url + '#gid=' + i.ref.gid + (i.ref.row ? '&range=' + i.ref.row + ':' + i.ref.row : '') : null;
        var linkLabel = i.ref && i.ref.row ? 'Open row ' + i.ref.row : 'Open tab';
        var fix = i.fix ? '<details class="fixbox"' + (n === 0 && i.level !== 'info' ? ' open' : '') + '><summary>How to fix <span class="where ' + esc(i.fix.where) + '">' + esc((WHERE[i.fix.where] || WHERE.none)(i)) + '</span></summary>' +
          '<ol>' + i.fix.steps.map(function (st) { return '<li>' + esc(st) + '</li>'; }).join('') + '</ol></details>' : '';
        return '<div class="issue' + (i.recovered ? ' rec' : '') + '"><span class="dot ' + (i.recovered ? 'ok' : i.level) + '"></span><div class="m"><span class="a">' + esc(i.area) + '</span>' + esc(i.message) + '</div>' +
          (i.detail ? '<div class="d">' + esc(i.detail) + '</div>' : '') + fix +
          '<div class="acts" style="margin-top:8px;align-items:center;flex-wrap:wrap">' + (i.fix && i.fix.where === 'app' ? appButton(s, true) : '') +
          (link ? '<a class="' + (i.fix && i.fix.where === 'app' && s.appUrl ? 'pill' : 'open-btn') + '" style="font-size:12.5px;padding:5px 11px" href="' + esc(link) + '" target="_blank" rel="noopener">' + linkLabel + ' ↗</a>' : '') +
          '<button type="button" class="linkbtn faint" data-hide="' + esc(issueKey(i)) + '" title="Hide on this device (for problems you have accepted)">Hide</button></div></div>';
      }).join('') : '<div class="good" style="font-size:14px;padding:6px 0">✓ Nothing to fix</div>';
      return '<div class="card">' + cardHead(SRC_LABEL[k] || k, list.length ? plural(list.length, 'item') : '', freshBadge(d.sources[k])) + body +
        '<div class="chip-row" style="margin-top:12px">' + appButton(d.sources[k]) + '</div></div>';
    }).join('') + '</div>';
    if (hiddenCount) html += '<div class="faint" style="font-size:13px;margin-top:12px">' + plural(hiddenCount, 'problem') + ' hidden · <button type="button" class="linkbtn" id="unhide">Show them again</button></div>';
    host.innerHTML = html;

    each(host, '.seg-ctl button', function (b) {
      b.addEventListener('click', function () { S.filter = b.getAttribute('data-f'); viewHealth(host, d); bindAppLinks(host); });
    });
    each(host, '[data-hide]', function (b) {
      b.addEventListener('click', function () {
        S.hidden[b.getAttribute('data-hide')] = Date.now();
        lsSet(LS.hidden, JSON.stringify(S.hidden));
        renderNav(); viewHealth(host, d); bindAppLinks(host);
        toast('Hidden on this device');
      });
    });
    $('recheck').addEventListener('click', recheck);
    if ($('unhide')) $('unhide').addEventListener('click', function () { S.hidden = {}; lsSet(LS.hidden, '{}'); renderNav(); viewHealth(host, d); });
  }

  /* Recheck: re-read the Sheets now and say what cleared. */
  function recheck() {
    if (!S.data) return;
    S.recheckFrom = {};
    S.data.issues.forEach(function (i) { S.recheckFrom[issueKey(i)] = i; });
    toast('Rechecking your Sheets…', 60000);
    load(true);
  }
  function reportRecheck() {
    var before = S.recheckFrom; S.recheckFrom = null;
    var now = {};
    S.data.issues.forEach(function (i) { if (!i.recovered) now[issueKey(i)] = 1; });
    var fixed = Object.keys(before).filter(function (k) { return !before[k].recovered && !now[k]; });
    var left = visibleIssues(S.data).filter(function (i) { return i.level !== 'info'; }).length;
    toast(fixed.length ? '✓ ' + plural(fixed.length, 'problem') + ' cleared · ' + left + ' left to fix' : 'Nothing new cleared yet · ' + left + ' left to fix. Changes made in an app show up after it syncs.', 5000);
  }
  var toastTimer;
  function toast(msg, ms) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, ms || 2500);
  }

  function renderFooter(d) {
    var parts = Object.keys(d.sources).map(function (k) {
      var s = d.sources[k];
      return '<span><span class="dot ' + (s.ok ? 'ok' : 'error') + '" style="margin-right:5px"></span>' +
        (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + ' sheet</a>' : esc(s.name)) +
        (s.appUrl ? ' · <a href="' + esc(s.appUrl) + '" target="_blank" rel="noopener">app</a>' : '') + ' <span class="num">' + s.ms + 'ms</span></span>';
    });
    parts.push('<span>Read-only · v' + esc(d.version) + '</span>');
    if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) parts.push('<span>Keys: <span class="kbd">1</span>–<span class="kbd">5</span> tabs · <span class="kbd">R</span> refresh</span>');
    if (MODE === 'remote') parts.push('<button type="button" class="linkbtn faint" data-reconnect>Connection settings</button>');
    each(document, '.foot', function (f) { f.innerHTML = parts.join(''); });
    each(document, '[data-reconnect]', function (b) { b.addEventListener('click', function () { showSetup(''); }); });
  }

  /* =========================================================
   * Theme, events, start
   * ======================================================= */
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function paintThemeBtn() { $('theme').innerHTML = svgIcon(currentTheme() === 'dark' ? 'sun' : 'moon'); }
  var savedTheme = lsGet(LS.theme);
  if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
  paintThemeBtn();
  $('theme').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    lsSet(LS.theme, next);
    paintThemeBtn();
    if (S.data) { S.animate = false; renderView(); }
  });
  $('refresh').addEventListener('click', function () { load(true); });

  var rz, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return; // ignore mobile toolbar height changes
    lastW = window.innerWidth;
    clearTimeout(rz);
    rz = setTimeout(function () { if (S.data) { S.animate = false; renderView(); } else pager.scrollLeft = viewIndex(S.view) * pageWidth(); }, 150);
  });
  window.addEventListener('online', function () { if (S.data && MODE !== 'setup') load(false); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - S.loadedAt > 10 * 60e3) load(false);
  });

  // Back / forward and #links switch tabs
  function fromAddress() {
    var v = (location.hash || '').replace('#', '');
    if (v && v !== S.view && VIEWS.some(function (x) { return x.key === v; })) go(v, { fromHistory: true });
  }
  window.addEventListener('popstate', fromAddress);
  window.addEventListener('hashchange', fromAddress);

  // PC: keyboard shortcuts
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test((e.target.tagName || ''))) return;
    if (MODE === 'setup') return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= VIEWS.length) { go(VIEWS[n - 1].key); e.preventDefault(); }
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !(e.target.closest && e.target.closest('.chart'))) {
      var to = viewIndex(S.view) + (e.key === 'ArrowRight' ? 1 : -1);
      if (to >= 0 && to < VIEWS.length) { go(VIEWS[to].key); e.preventDefault(); }
    }
    else if (e.key === 'r' || e.key === 'R') { load(true); e.preventDefault(); }
  });

  // Home-screen app: pull down to refresh (iOS has no built-in one there)
  (function () {
    var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
    if (!standalone || !('ontouchstart' in window)) return;
    var startY = null, dy = 0, ptr = $('ptr');
    document.addEventListener('touchstart', function (e) { startY = activeScrollTop() <= 0 && e.touches.length === 1 && !(e.target.closest && e.target.closest('.chart')) ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (startY === null) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      ptr.style.transform = 'translate(-50%, ' + (Math.min(dy, 110) - 60) + 'px) rotate(' + dy * 3 + 'deg)';
    }, { passive: true });
    document.addEventListener('touchend', function () {
      if (startY === null) return;
      startY = null;
      if (dy > 80 && MODE !== 'setup') {
        ptr.classList.add('spin'); ptr.style.transform = 'translate(-50%, 24px)';
        load(true);
        var wait = setInterval(function () { if (!$('refresh').disabled) { clearInterval(wait); ptr.classList.remove('spin'); ptr.style.transform = ''; } }, 200);
      } else ptr.style.transform = '';
    });
  })();

  // Home-screen app: keep working offline (shows the last saved data)
  if (MODE === 'remote' || MODE === 'setup') {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
    }
  }

  var startView = (location.hash || '').replace('#', '');
  S.view = VIEWS.some(function (v) { return v.key === startView; }) ? startView : 'overview';
  renderNav();
  setActive(S.view, { fromHistory: true });
  pager.scrollLeft = viewIndex(S.view) * pageWidth();
  if (MODE === 'setup') { showSetup(''); return; }
  try {
    var saved = lsGet(LS.data);
    if (saved) { S.data = JSON.parse(saved); S.stale = true; render(); }
  } catch (e) { S.data = null; }
  load(false);
})();
</script>
</body>
</html>
