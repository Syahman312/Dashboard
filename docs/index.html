/* ---------- Charts ---------- */
.chart { position: relative; width: 100%; user-select: none; -webkit-user-select: none; touch-action: pan-y; }

.hb { padding: 7px 8px; margin: 0 -8px; border-radius: 10px; transition: background .15s; }

/* Health */
.health-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
.seg-ctl { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }

.issue { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 4px 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.issue:first-of-type { border-top: 0; }
.issue .dot { margin-top: 7px; }
.issue .m { font-size: 14px; overflow-wrap: anywhere; }
.issue .d { grid-column: 2; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.issue .a { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .07em; margin-right: 6px; }
.issue .acts { grid-column: 2; display: flex; gap: 14px; font-size: 12.5px; margin-top: 2px; }
.issue .acts a, .linkbtn { color: var(--accent); text-decoration: none; background: none; border: 0; padding: 0; font-size: 12.5px; cursor: pointer; }
.linkbtn.faint { color: var(--faint); }

.issue.rec .m { color: var(--muted); }
.fixbox { grid-column: 2; margin-top: 6px; }
.fixbox summary { cursor: pointer; font-size: 12.5px; color: var(--accent); list-style: none; display: inline-flex; align-items: center; gap: 6px; }

.fixbox li { margin: 4px 0; }
.where { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--card-2); color: var(--muted); margin-left: 6px; }

.where.sheet { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.issue .acts a.open-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 8px; background: var(--accent); color: var(--accent-ink) !important; font-size: 12.5px; font-weight: 600; text-decoration: none; }
#toast { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translate(-50%, 20px); opacity: 0; transition: opacity .2s, transform .2s; background: var(--card-3); border: 1px solid var(--line); box-shadow: 0 12px 32px rgba(0,0,0,.3); border-radius: 12px; padding: 10px 16px; font-size: 14px; max-width: calc(100vw - 32px); pointer-events: none; }

.fresh { font-size: 11.5px; font-weight: 550; padding: 3px 9px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.fresh .dot { width: 6px; height: 6px; }
.banner { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); margin-top: 14px; font-size: 13.5px; color: var(--muted); }
.banner.err { border-color: var(--bad); color: var(--text); }
.skel { height: 180px; border-radius: var(--radius); background: linear-gradient(90deg, var(--card) 0%, var(--card-2) 50%, var(--card) 100%); background-size: 200% 100%; animation: sh 1.2s infinite linear; }
@keyframes sh { to { background-position: -200% 0; } }
/* First-run setup (home-screen app) */
.setup { max-width: 460px; margin: 28px auto 0; text-align: center; }
.setup .logo { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 28px rgba(0,0,0,.35); }
.setup h2 { font-size: 24px; margin: 16px 0 4px; letter-spacing: -.02em; }
.setup form { text-align: left; margin-top: 18px; }
.setup label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
.setup input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
.setup input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn { display: block; width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: inherit; font-weight: 650; cursor: pointer; }

.hint { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
/* Large PC screens: use the space */
@media (min-width: 1600px) {

/* Touch screens: every tap target at least 44px tall */
@media (pointer: coarse) {

  .mpick button { width: 44px; }
  .pill { padding: 0 14px; }
  .seg-ctl button { padding: 0 14px; }
  .linkbtn { min-height: 44px; display: inline-flex; align-items: center; padding: 0 6px; }

  .tabs { margin-top: 2px; }

input, select, textarea { font-size: 16px !important; }

.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }

@media (max-width: 420px) { .strip { grid-template-columns: 1fr; } }
.strip .card { padding: 14px 16px; cursor: pointer; }
.strip .k { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.strip .unit { font-size: 14px; font-weight: 500; color: var(--muted); }

.hchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }

.hchips span.due { border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); }
.alerts { list-style: none; margin: 0; padding: 0; }
.alerts li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 8px; margin: 0 -8px; border-radius: 10px; cursor: pointer; }
@media (hover: hover) { .alerts li:hover { background: var(--card-2); } }

.alerts li.bad .ic { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.alerts li.warn .ic { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.alerts li.info .ic { background: color-mix(in srgb, var(--info) 16%, transparent); color: var(--info); }

.tiles.mini4 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tiles.mini3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

.tiles.mini4 .v, .tiles.mini3 .v { font-size: 20px; }
.bbar { position: relative; height: 10px; border-radius: 5px; background: var(--card-3); overflow: visible; margin: 8px 0 4px; }
.bbar i { display: block; height: 100%; border-radius: 5px; background: var(--s1); width: 0; transition: width .8s cubic-bezier(.2,.7,.2,1); max-width: 100%; }
.bbar.over i { background: var(--bad); }
.bbar .pace { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); opacity: .55; border-radius: 1px; }
.synct { width: 100%; border-collapse: collapse; font-size: 14px; }

.synct tr:first-child td { border-top: 0; }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--card-2); white-space: nowrap; }
.st.ok { color: var(--good); } .st.stale { color: var(--warn); } .st.broken, .st.error { color: var(--bad); } .st.off { color: var(--faint); }
/* Interactive bits shared by all tabs */
.ring { flex: none; display: block; }

.chips2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chips2 button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
.chips2 button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips2 .cn { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; font-size: 11px; font-weight: 700; background: color-mix(in srgb, currentColor 16%, transparent); }
@media (pointer: coarse) { .chips2 button { min-height: 40px; padding: 0 14px; } }
details.xrow { border-top: 1px solid var(--line); }
details.xrow:first-of-type { border-top: 0; }
details.xrow > summary { list-style: none; display: flex; gap: 10px; justify-content: space-between; align-items: center; padding: 10px 0; cursor: pointer; min-height: 44px; }
details.xrow > summary::-webkit-details-marker { display: none; }
details.xrow > summary .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.xrow[open] > summary .t { white-space: normal; }
details.xrow .xb { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 0 12px; font-size: 13px; color: var(--muted); animation: rise .2s ease; }
details.xrow .xb b { color: var(--text); font-weight: 600; }
.searchbox { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; }
.searchbox:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.ringrow { display: flex; align-items: center; gap: 14px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dh { font-size: 10.5px; color: var(--faint); text-align: center; text-transform: uppercase; letter-spacing: .05em; }
.cal .dc { position: relative; aspect-ratio: 1; border-radius: 8px; background: var(--card-2); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); max-height: 46px; }
.cal .dc.has { background: color-mix(in srgb, var(--s2) 22%, var(--card-2)); color: var(--text); font-weight: 650; cursor: pointer; }
.cal .dc.today { outline: 1.5px solid var(--accent); }
.cal .dc .amt { font-size: 9.5px; font-weight: 600; color: var(--s2); }
.cal .dc.blank { background: none; }
footer { margin-top: 28px; padding-bottom: 56px; color: var(--faint); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
footer a { color: var(--muted); }
/* Weekly trend */
.trend { display: inline-flex; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--card-2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.week { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.week button { text-align: left; font: inherit; color: inherit; background: var(--card-2); border: 1px solid transparent; border-radius: 14px; padding: 12px 14px; cursor: pointer; transition: border-color .15s, transform .15s; }
@media (hover: hover) { .week button:hover { border-color: var(--accent); transform: translateY(-1px); } }
.week .wl { font-size: 12px; color: var(--faint); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.week .wv { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 6px; }
.week .wp { font-size: 12px; color: var(--faint); margin-top: 4px; }
/* Month review */
.rv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
.rv-lists { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 600px) { .rv-lists { grid-template-columns: 1fr; } }

.rv-lists li { display: flex; gap: 8px; padding: 5px 0; }
.rv-lists li::before { flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
.rv-lists .wins li::before { content: '✓'; background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }

.tag.new { background: var(--accent); color: var(--accent-ink); }
/* Budget tab */
.bud-row summary { display: block !important; }
.bud-row .bh { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.bud-row .bh .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bud-row .bs { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
.mini { display: flex; align-items: flex-end; gap: 6px; height: 74px; position: relative; margin: 6px 0 4px; padding-top: 4px; }
.mini .mb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
.mini .mb i { display: block; width: 100%; max-width: 30px; border-radius: 4px 4px 0 0; background: var(--s1); min-height: 2px; }
.mini .mb.over i { background: var(--bad); }
.mini .mb.cur i { opacity: .55; }
.mini .mb span { font-size: 10.5px; color: var(--faint); }
.mini .bl { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--text); opacity: .45; }
.xb2 { padding: 0 0 12px; font-size: 13px; color: var(--muted); animation: rise .2s ease; }
.xb2 .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
.xb2 b { color: var(--text); font-weight: 600; }
/* Quick add */
#fab { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); z-index: 35; width: 56px; height: 56px; border-radius: 18px; border: 0; background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 24px rgba(0,0,0,.28); display: grid; place-items: center; cursor: pointer; transition: transform .15s; }
#fab svg { width: 26px; height: 26px; }

@media (max-width: 680px) { #fab { bottom: calc(78px + env(safe-area-inset-bottom)); right: 14px; width: 52px; height: 52px; } }
.setup-mode #fab { display: none; }
/* Quick add: a floating panel that slides in (from the right on PC, from below on phones) */
#qa { position: fixed; inset: 0; z-index: 50; visibility: hidden; pointer-events: none; transition: visibility 0s linear .28s; }
#qa.on { visibility: visible; pointer-events: auto; transition-delay: 0s; }
#qa .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .28s ease; }
#qa.on .scrim { opacity: 1; }
#qa .panel { position: absolute; left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); margin: 0 auto; max-width: 520px; max-height: calc(100dvh - 40px); overflow: auto; overscroll-behavior: contain;
  background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.28), var(--shadow);
  transform: translateY(calc(100% + 24px)); transition: transform .28s cubic-bezier(.32,.72,0,1); }
#qa.on .panel { transform: none; }
@media (min-width: 681px) { #qa .panel { left: auto; top: 12px; right: 12px; bottom: 12px; width: 400px; max-width: calc(100vw - 24px); max-height: none; margin: 0; transform: translateX(calc(100% + 24px)); } }
#qa h2 { margin: 4px 48px 18px 0; font-size: 18px; }

#qa .qtabs button { font: inherit; font-size: 14px; font-weight: 600; padding: 10px 6px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card-2); color: var(--muted); cursor: pointer; }

#qa label { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
#qa input { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
#qa input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
#qa .btn { width: 100%; margin-top: 14px; }
#qa .hint { font-size: 12.5px; color: var(--faint); margin-top: 8px; }
#qa .amt { font-size: 28px !important; font-weight: 700; font-variant-numeric: tabular-nums; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>

  function cardHead(title, sub, right) {
    return '<div class="card-h"><div><h2>' + title + '</h2>' + (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>' + (right ? '<div style="display:flex;gap:10px;align-items:center">' + right + '</div>' : '') + '</div>';
  }
  function tile(v, l, s, cls, attrs) {
    return '<div class="tile"><div class="v num ' + (cls || '') + '"' + (attrs || '') + '>' + v + '</div><div class="l">' + l + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  }
  function failedCard(name, src) {

  }
  var VIEW_TRENDS = { Flow: ['tasks', 'habits', 'study'], Money: ['spend'], Garage: ['car'] };
  function viewHeader(title, src) {
    var chips = (VIEW_TRENDS[title] || []).map(function (k) { var w = S.data && weekBy(S.data, k); return w ? '<span style="display:inline-flex;gap:4px;align-items:center;font-size:12px" class="muted">' + esc(w.label) + ' ' + trendChip(w, true) + '</span>' : ''; }).join('');
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap">' +
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0;font-size:22px;letter-spacing:-.02em">' + title + '</h2>' + freshBadge(src) + chips + '</div>' +
      '<div class="chip-row">' + appButton(src) + (src && src.url ? '<a class="pill" href="' + esc(src.url) + '" target="_blank" rel="noopener">Open sheet ↗</a>' : '') + '</div></div>';
  }
  /** "Open Flow app" — or, until its link is set, a button that explains how to add it. */
  function appButton(src, small) {
    if (!src) return '';
    if (src.appUrl) return '<a class="' + (small ? 'open-btn' : 'pill app-pill') + '" href="' + esc(src.appUrl) + '" target="_blank" rel="noopener">Open ' + esc(src.name) + ' app ↗</a>';
    if (small) return '';
    return '<button type="button" class="pill" data-applink="' + esc(src.appProp || '') + '" data-appname="' + esc(src.name) + '">+ Link ' + esc(src.name) + ' app</button>';
  }
  function bindAppLinks(root) {
    each(root, '[data-applink]', function (b) {
      b.addEventListener('click', function () {
        toast('Add the ' + b.getAttribute('data-appname') + ' app\'s address in Apps Script → Project Settings → Script Properties as ' + b.getAttribute('data-applink') + ', then press Refresh.', 9000);
      });
    });
  }
  function taskLi(t, mode) {
    var right = mode === 'late' ? '<span class="tag late">' + shortDate(t.date) + '</span>'
      : mode === 'date' ? '<span class="r">' + dayName(t.date) + ' ' + shortDate(t.date) + '</span>'
      : (t.time ? '<span class="r num">' + esc(t.time) + '</span>' : '');
    return '<li><span class="t">' + esc(t.task) + (t.top3 ? '<span class="tag t3">Top 3</span>' : '') + '</span>' + right + '</li>';
  }
  function bindGo(root) {
    each(root, '[data-go]', function (b) {
      b.addEventListener('click', function () { go(b.getAttribute('data-go'), { filter: b.getAttribute('data-f') }); });
    });
  }

  /* =========================================================
   * Overview
   * ======================================================= */
  function viewOverview(host, d) {
    var t = d.todayStrip || {}, alerts = d.alerts || [], sync = d.sync || [];
    var html = '';

    // ---- Today strip
    html += '<div class="strip">';
    var tk = t.tasks;
    html += '<div class="card" data-go="flow"><div class="k"><span class="eyebrow">Tasks today</span>' + (tk && tk.overdue ? '<span class="tag late">' + tk.overdue + ' overdue</span>' : trendChip(weekBy(d, 'tasks'), true)) + '</div>' +
      (tk ? '<div class="big num">' + tk.due + ' <span class="unit">due · ' + tk.done + ' done</span></div>' +
        (tk.items.length ? '<ul>' + tk.items.map(function (x) { return '<li>' + (x.time ? '<span class="num">' + esc(x.time) + '</span> · ' : '') + esc(x.task) + (x.top3 ? ' ★' : '') + '</li>'; }).join('') + '</ul>' : '<div class="empty">Nothing due today</div>')
        : '<div class="empty">Flow not connected</div>') + '</div>';
    var hb = t.habits;
    html += '<div class="card" data-go="flow"><div class="k"><span class="eyebrow">Habits today</span>' + trendChip(weekBy(d, 'habits'), true) + '</div>' +
      (hb && hb.total ? '<div class="ringrow" style="gap:10px;margin:4px 0 2px">' + ring(hb.done / hb.total, { size: 40, stroke: 5, color: 'var(--good)' }) + '<div class="big num" style="margin:0">' + hb.done + ' <span class="unit">of ' + hb.total + ' done</span></div></div>' +
        '<div class="hchips">' + hb.items.map(function (h) { return '<span class="' + (h.done ? 'done' : h.due ? 'due' : '') + '" title="' + (h.done ? 'Done today' : h.due ? 'Due today' : 'Weekly target already met') + '">' + esc(h.icon) + ' ' + esc(h.habit) + '</span>'; }).join('') + '</div>'
        : '<div class="empty">No habits yet</div>') + '</div>';
    var gr = t.garage;
    html += '<div class="card" data-go="garage"><div class="k"><span class="eyebrow">Next Garage reminder</span>' + trendChip(weekBy(d, 'car'), true) + '</div>' +
      (gr ? '<div class="big num ' + (gr.daysLeft < 0 ? 'bad' : gr.daysLeft <= 30 ? 'warnc' : '') + '">' + (gr.daysLeft < 0 ? 'Overdue' : gr.daysLeft + ' days') + '</div>' +
        '<ul><li>' + esc(gr.car) + ' · ' + esc(gr.label.toLowerCase()) + '</li><li>' + shortDate(gr.date) + ' ' + gr.date.slice(0, 4) + '</li></ul>'
        : '<div class="empty">No reminders</div>') + '</div>';
    var vt = t.vault, vsrc = d.sources.vault;
    html += '<div class="card" data-go="vault"><div class="k"><span class="eyebrow">Vault · next 30 days</span>' + (vt && vt.expired ? '<span class="tag late">' + vt.expired + ' expired</span>' : '') + '</div>' +
      (vt ? '<div class="big num ' + (vt.count ? 'warnc' : '') + '">' + vt.count + ' <span class="unit">' + (vt.count === 1 ? 'document' : 'documents') + '</span></div>' +
        (vt.items.length ? '<ul>' + vt.items.map(function (x) { return '<li>' + esc(x.icon) + ' ' + esc(x.title) + ' · ' + (x.daysLeft < 0 ? 'expired' : x.daysLeft + 'd') + '</li>'; }).join('') + '</ul>' : '<div class="empty">Nothing expiring</div>')
        : '<div class="empty">' + (vsrc && vsrc.off ? 'Add VAULT_SHEET_ID to connect Vault' : 'Vault not connected') + '</div>') + '</div>';
    html += '</div>';

    // ---- This week, and the month review (first week of the month: straight after the strip)
    var earlyMonth = +d.today.slice(8, 10) <= 7;
    html += weekCard(d);
    if (earlyMonth) html += reviewCard(d);

    // ---- Alerts feed + Money snapshot
    html += '<div class="grid g-21">';
    var ICON = { bad: '!', warn: '•', info: 'i' };
    var srcs = {};
    alerts.forEach(function (a) { srcs[a.src] = (srcs[a.src] || 0) + 1; });
    var af = S.ui.alerts !== 'all' && !srcs[S.ui.alerts] ? 'all' : S.ui.alerts;
    var shown = alerts.filter(function (a) { return af === 'all' || a.src === af; });
    html += '<div class="card" id="alerts-card">' + cardHead('Alerts', alerts.length ? plural(alerts.length, 'thing') + ' that need action' : 'Nothing needs action') +
      (Object.keys(srcs).length > 1 ? chipBar('alerts', [{ key: 'all', label: 'All', count: alerts.length }].concat(Object.keys(srcs).map(function (k) { return { key: k, label: SRC_LABEL[k] || k, count: srcs[k] }; })), af) : '') +
      (shown.length ? '<ul class="alerts">' + shown.slice(0, 12).map(function (a) {
        var when = a.days === null ? '' : a.days < 0 ? '<span class="bad">' + (-a.days) + 'd ago</span>' : a.days === 0 ? '<span class="warnc">Today</span>' : a.days === 1 ? 'Tomorrow' : shortDate(a.date) + '<div class="dd">in ' + a.days + 'd</div>';
        return '<li class="' + esc(a.level) + '" data-go="' + esc(a.view) + '"><span class="ic">' + ICON[a.level] + '</span><div style="min-width:0"><div class="tt">' + esc(a.title) + '</div>' +
          '<div class="dd">' + esc(SRC_LABEL[a.src] || '') + (a.detail ? ' · ' + esc(a.detail) : '') + '</div></div><div class="when num">' + when + '</div></li>';
      }).join('') + '</ul>' + (shown.length > 12 ? '<div class="faint" style="font-size:13px;margin-top:6px">+ ' + (shown.length - 12) + ' more in Health</div>' : '')
        : '<div class="good" style="font-size:14px">✓ All clear across your apps</div>') + '</div>';

    var fi = d.sources.finance;
    html += '<div class="card" data-go="money" style="cursor:pointer">' + cardHead('Money snapshot', fi && fi.ok && fi.summary.month ? monLabel(fi.summary.month.month, true) : '', trendChip(weekBy(d, 'spend'), true));
    if (fi && fi.ok) {
      var fs = fi.summary, bud = fs.budget, m = fs.month;
      html += '<div class="eyebrow">Net worth</div><div class="hero num" style="font-size:30px;margin:4px 0 12px" data-count="' + fs.netWorth + '" data-fmt="rm0">' + rm(fs.netWorth, 0) + '</div>';
      if (bud && bud.total) {
        var over = bud.spent > bud.total;
        html += '<div class="ringrow" style="margin-bottom:8px">' + ring(bud.spent / bud.total, { size: 56, stroke: 6, label: bud.pct + '%', fs: 12, color: over ? 'var(--bad)' : bud.pct > bud.pacePct ? 'var(--warn)' : 'var(--good)' }) +
          '<div style="font-size:13.5px"><div>Budget: <b class="num">' + (over ? rm(-bud.left, 0) + ' over' : rm(bud.left, 0) + ' left') + '</b></div><div class="faint num" style="font-size:12px">' + (over ? '' : rm(bud.left / Math.max(1, daysLeftInMonth(d.today)), 0) + ' a day for the rest of the month') + '</div></div></div>' +
          '<div style="display:flex;justify-content:space-between;font-size:13.5px"><span>Spent <b class="num">' + rm(bud.spent, 0) + '</b> of ' + rm(bud.total, 0) + '</span><span class="num ' + (over ? 'bad' : 'muted') + '">' + (over ? rm(-bud.left, 0) + ' over' : rm(bud.left, 0) + ' left') + '</span></div>' +
          '<div class="bbar' + (over ? ' over' : '') + '" title="Line = where you should be by today"><i data-w="' + Math.min(100, bud.pct) + '%"></i><span class="pace" style="left:' + bud.pacePct + '%"></span></div>' +
          '<div class="faint" style="font-size:12px">' + bud.pct + '% used · ' + bud.pacePct + '% of the month gone</div>';
      } else if (m) {
        html += '<div style="font-size:13.5px">Spent <b class="num">' + rm(m.spent, 0) + '</b> this month</div><div class="faint" style="font-size:12px;margin-top:4px">No budget yet: run createBudgetTab in the editor</div>';
      }
      var rec = (fs.recurring || []).filter(function (r) { return r.daysUntil >= -3 && r.daysUntil <= 31; });
      html += '<h3 class="sec">Upcoming recurring</h3>' + (rec.length ? '<ul class="list">' + rec.slice(0, 5).map(function (r) {
        return '<li><span class="t"><span class="when' + (r.daysUntil <= 3 ? ' soon' : '') + '">' + (r.daysUntil <= 0 ? 'Due' : shortDate(r.next)) + '</span>' + esc(r.name) + '</span><span class="r num">' + rm(r.amount) + '</span></li>';
      }).join('') + '</ul>' : '<div class="empty">None in the next month</div>');
    } else html += '<div class="empty">Finance not connected</div>';
    html += '</div></div>';

    if (!earlyMonth) html += '<div style="margin-top:14px"></div>' + reviewCard(d);

    // ---- Sync health
    var ST = { ok: 'Healthy', stale: 'No recent saves', broken: 'Sync failing', error: 'Sheet unreadable', off: 'Not connected' };
    var now = d.generatedAt;
    html += '<div class="card" style="margin-top:14px">' + cardHead('Sync health', 'When each app last saved to its sheet') + '<table class="synct"><tbody>' +
      sync.map(function (r) {
        return '<tr><td style="width:30%"><b>' + esc(r.name) + '</b></td><td><span class="st ' + r.status + '"><span class="dot ' + ({ ok: 'ok', stale: 'warn', broken: 'error', error: 'error', off: 'info' })[r.status] + '"></span>' + ST[r.status] + '</span></td>' +
          '<td class="muted" style="font-size:13px">' + (r.lastChange ? 'Saved ' + rel(r.lastChange, now) : r.status === 'off' ? '' : 'No saves seen') + (r.lastFailure && r.status === 'broken' ? '<div class="bad" style="font-size:12px">Last failure ' + rel(r.lastFailure, now) + '</div>' : '') + '</td>' +
          '<td style="text-align:right">' + (r.status === 'broken' || r.status === 'error' ? '<button type="button" class="linkbtn" data-go="health">Fix</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';

    // ---- Open apps
    html += '<div class="card" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">' +
      '<div><h2 style="font-size:15px;margin:0">Open your apps</h2><div class="faint" style="font-size:12.5px">Jump straight into an app to add or fix something</div></div>' +
      '<div class="chip-row">' + ['flow', 'finance', 'garage', 'vault', 'career', 'voyage', 'nest'].filter(function (k) { return d.sources[k] && !d.sources[k].off; }).map(function (k) { return appButton(d.sources[k]); }).join('') + '</div></div>';

    host.innerHTML = html;
    bindGo(host);
    bindReview(host, d);
    bindChips(host, 'alerts', function (k) { S.ui.alerts = k; S.animate = false; viewOverview(host, d); bindAppLinks(host); fillBars(host); });
  }

  /* =========================================================
   * Vault
   * ======================================================= */
  function viewVault(host, d) {
    var src = d.sources.vault;
    if (!src || src.off) {
      host.innerHTML = viewHeader('Vault', null) + '<div class="card"><div class="note">Vault is not connected yet. Run <b>setupDashboard</b> in the Apps Script editor (or add <b>VAULT_SHEET_ID</b> in Script Properties), then press Refresh.</div></div>';
      return;
    }
    if (!src.ok) { host.innerHTML = failedCard('Vault', src); return; }
    var s = src.summary, all = s.timeline || s.expired.concat(s.upcoming);
    var html = viewHeader('Vault', src);
    html += '<div class="tiles" style="margin-bottom:14px">' + tile(s.total, 'Documents') + tile(s.expired.length, 'Expired', null, s.expired.length ? 'bad' : '') +
      tile(s.expiring30.length, 'Expiring in 30 days', null, s.expiring30.length ? 'warnc' : '') +
      tile(all.filter(function (x) { return x.daysLeft > 30 && x.daysLeft <= x.lead; }).length, 'Renewal window open', 'within each category\'s lead time') + '</div>';
    html += '<div class="card" style="margin-bottom:14px">' + cardHead('Expiry timeline', 'Next 12 months · hover or tap a dot') + '<div id="vault-filters"></div><div id="vault-tl"></div></div>';
    html += '<div class="grid g-21">';
    html += '<div class="card">' + cardHead('Documents by expiry', 'Soonest first') + '<div id="vault-list"></div></div>';
    html += '<div class="card">' + cardHead('By category') + '<ul class="list">' + s.byCategory.map(function (c) {
      return '<li><span class="t">' + esc(c.icon) + ' ' + esc(c.category) + '</span><span class="r num">' + c.count + '</span></li>';
    }).join('') + '</ul></div>';
    html += '</div>';
    host.innerHTML = html;

    var tone = function (x) { return x.daysLeft < 0 ? 'bad' : x.daysLeft <= 30 ? 'warn' : x.daysLeft <= x.lead ? 'info' : 'ok'; };
    var COL = { bad: '--bad', warn: '--warn', info: '--info', ok: '--s1' };
    function draw() {
      var cats = {}, owners = s.owners || [];
      all.forEach(function (x) { if (x.category) cats[x.category] = (cats[x.category] || 0) + 1; });
      var list = all.filter(function (x) {
        return (S.ui.vcat === 'all' || x.category === S.ui.vcat) && (S.ui.vowner === 'all' || x.owner === S.ui.vowner);
      });
      $('vault-filters').innerHTML = chipBar('vcat', [{ key: 'all', label: 'All', count: all.length }].concat(Object.keys(cats).map(function (k) { return { key: k, label: k, count: cats[k] }; })), S.ui.vcat) +
        (owners.length > 1 ? chipBar('vowner', [{ key: 'all', label: 'Everyone' }].concat(owners.map(function (o) { return { key: o, label: o }; })), S.ui.vowner) : '');
      bindChips($('vault-filters'), 'vcat', function (k) { S.ui.vcat = k; draw(); });
      bindChips($('vault-filters'), 'vowner', function (k) { S.ui.vowner = k; draw(); });

      // Timeline (plain SVG): expired on the far left, then the next 12 months
      var host2 = $('vault-tl'); host2.textContent = '';
      var W = Math.max(300, host2.clientWidth || 600), H = 150, L = 84, R = 12, top = 22, base = 112;
      var X = function (days) { return days < 0 ? 28 : L + (W - L - R) * Math.min(days, 365) / 365; };
      var svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, height: H, role: 'img', 'aria-label': 'Document expiry timeline' }, host2);
      host2.classList.add('chart');
      sv('line', { x1: L, x2: W - R, y1: base, y2: base, 'class': 'base' }, svg);
      for (var m = 0; m <= 12; m += (W < 520 ? 3 : 2)) {
        var iso = addMonthsIso(d.today, m), dx = X(daysBetweenIso(d.today, iso));
        sv('line', { x1: dx, x2: dx, y1: top - 6, y2: base, 'class': 'gl' }, svg);
        sv('text', { x: dx, y: base + 18, 'text-anchor': 'middle', 'class': 'tick' }, svg).textContent = m === 0 ? 'Today' : MONTHS[parseIso(iso).getUTCMonth()];
      }
      sv('rect', { x: 6, y: top - 6, width: 44, height: base - top + 6, rx: 6, fill: css('--bad'), opacity: .08 }, svg);
      sv('text', { x: 28, y: base + 18, 'text-anchor': 'middle', 'class': 'tick' }, svg).textContent = 'Expired';
      sv('line', { x1: X(30), x2: X(30), y1: top - 6, y2: base, stroke: css('--warn'), 'stroke-dasharray': '3 3', opacity: .7 }, svg);
      sv('text', { x: X(30) + 4, y: top - 8, 'class': 'tick' }, svg).textContent = '30 days';
      var lanes = [];
      var later = 0;
      list.slice().sort(function (a, b) { return a.daysLeft - b.daysLeft; }).forEach(function (x) {
        if (x.daysLeft > 365) { later++; return; }
        var cx = X(x.daysLeft), lane = 0;
        while (lanes[lane] !== undefined && cx - lanes[lane] < 16) lane++;
        lanes[lane] = cx;
        var cy = base - 14 - (lane % 5) * 17;
        sv('line', { x1: cx, x2: cx, y1: cy, y2: base, stroke: css(COL[tone(x)]), 'stroke-width': 1, opacity: .4 }, svg);
        var dot = sv('circle', { cx: cx, cy: cy, r: 7, fill: css(COL[tone(x)]), stroke: css('--card'), 'stroke-width': 2, style: 'cursor:pointer' }, svg);
        var hit = sv('circle', { cx: cx, cy: cy, r: 14, fill: 'transparent', style: 'cursor:pointer' }, svg);
        var show = function (evt) {
          showTip(evt.clientX, evt.clientY, (x.icon ? x.icon + ' ' : '') + x.title, [{ color: css(COL[tone(x)]), value: x.daysLeft < 0 ? 'Expired ' + (-x.daysLeft) + 'd ago' : 'In ' + x.daysLeft + ' days', label: shortDate(x.expiry) + ' ' + x.expiry.slice(0, 4) }],
            [x.category + (x.owner ? ' · ' + x.owner : ''), x.daysLeft >= 0 && x.daysLeft <= x.lead ? 'Renewal window open (' + x.lead + '-day lead time)' : 'Renewal reminder starts ' + x.lead + ' days before'].filter(Boolean));
        };
        [dot, hit].forEach(function (el) { el.addEventListener('pointermove', show); el.addEventListener('pointerdown', show); el.addEventListener('pointerleave', mouseLeave); });
      });
      if (later) sv('text', { x: W - R, y: top - 8, 'text-anchor': 'end', 'class': 'tick' }, svg).textContent = '+' + later + ' later';
      if (!list.length) host2.innerHTML = '<div class="empty">No documents with an expiry date' + (S.ui.vcat !== 'all' || S.ui.vowner !== 'all' ? ' in this filter' : '') + '.</div>';

      $('vault-list').innerHTML = list.length ? list.map(function (x) {
        var cls = { bad: 'bad', warn: 'warnc', info: 'muted', ok: 'faint' }[tone(x)];
        return '<details class="xrow"><summary><span class="t">' + esc(x.icon) + ' ' + esc(x.title) + (x.owner && x.owner !== 'Me' ? '<span class="tag">' + esc(x.owner) + '</span>' : '') + '</span>' +
          '<span class="r num ' + cls + '">' + (x.daysLeft < 0 ? 'expired' : x.daysLeft + 'd') + '</span></summary>' +
          '<div class="xb"><span>Expires <b>' + shortDate(x.expiry) + ' ' + x.expiry.slice(0, 4) + '</b></span><span>Category <b>' + esc(x.category || '—') + '</b></span>' +
          '<span>Reminder <b>' + x.lead + ' days before</b></span>' + (x.owner ? '<span>For <b>' + esc(x.owner) + '</b></span>' : '') + '</div></details>';
      }).join('') : '<div class="empty">Nothing here.</div>';
    }
    draw();
  }

  /* =========================================================
   * Life: NextRole (career), Voyage (trips), Nest (home)
   * ======================================================= */
  var LIFE = [['career', 'NextRole', 'NEXTROLE_SHEET_ID', 'Career goals, job applications, ACCA and CPD'],
    ['voyage', 'Voyage', 'VOYAGE_SHEET_ID', 'Trips: countdown, budget, to-dos and packing'],
    ['nest', 'Nest', 'NEST_SHEET_ID', 'Home setup: move-in, budget, must-haves and upkeep']];
  function inDays(n) { return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n < 0 ? (-n) + 'd ago' : 'in ' + n + 'd'; }
  function money(n, ccy) { return !ccy || ccy === 'MYR' || ccy === 'RM' ? rm(n, 0) : esc(ccy) + ' ' + nf().format(Math.round(n)); }
  function lifeHead(src, title, icon) {
    return '<div class="card-h"><div><h2>' + icon + ' ' + esc(title) + '</h2><div class="sub">' + freshBadge(src) + '</div></div>' +
      '<div style="display:flex;gap:8px;align-items:center">' + (src.url ? '<a class="linkbtn" href="' + esc(src.url) + '" target="_blank" rel="noopener">Sheet ↗</a>' : '') + '</div></div>';
  }
  function lifeEmpty(src, name, prop, what) {
    if (src && !src.off && !src.ok) return '<div class="card">' + cardHead(esc(name)) + '<div class="note bad">Could not read the ' + esc(name) + ' sheet.<br>' + esc(src.error) + '</div></div>';
    return '<div class="card">' + cardHead(esc(name), esc(what)) + '<div class="note">Not connected yet. Run <b>setupDashboard</b> in the Apps Script editor (or add <b>' + prop + '</b> in Script Properties), then press Refresh.</div></div>';

          '<div class="bs"><span>' + (r.pct === null ? '' : r.pct + '% used') + '</span><span>' + (st === 'over' ? rm(-r.left, 0) + ' over' : rm(r.left, 0) + ' left · ' + rm(r.left / Math.max(1, left), 0) + '/day') + '</span></div></summary>' +
          '<div class="xb2"><div class="mini">' + bars + (r.budget > 0 ? '<div class="bl" style="bottom:' + (18 + r.budget / mx * 56).toFixed(1) + 'px" title="Budget ' + esc(rm(r.budget, 0)) + '"></div>' : '') + '</div>' +

    bindChips(host, 'budsort', function (k) { S.ui.budSort = k; sort = k; each(host, '[data-chipgroup="budsort"] [data-chip]', function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-chip') === k); }); drawRows(); });

  /* =========================================================

      var u = new URL(src.appUrl);

      if (hash) u.hash = hash;

  function qaBody() {

      '<div class="hint">Flow reads dates, times, #area and !priority the same way as its own quick add.</div><button class="btn" type="submit">Add in Flow</button></form>';
    if (k === 'expense') html += '<form data-qf="expense"><label for="qa-a">Amount (RM)</label><input id="qa-a" class="amt" name="a" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00" required>' +
      '<label for="qa-d">What for</label><input id="qa-d" name="d" autocomplete="off" enterkeyhint="go" placeholder="e.g. Lunch, Shopee, parking">' +
      '<div class="hint">Finance opens its new-expense form with these filled in. Pick the category and account, then Save.</div><button class="btn" type="submit">Continue in Finance</button></form>';
    if (k === 'fuel') html += '<form data-qf="fuel"><div class="note">Garage opens straight on its fill-up form, with your car and odometer ready.</div><button class="btn" type="submit">Log fill-up in Garage</button></form>';

  }
  function qaDraw(focus) {
    var box = $('qa-body'); box.innerHTML = qaBody();
    each(box, '[data-qk]', function (b) { b.addEventListener('click', function () { QA.kind = b.getAttribute('data-qk'); lsSet('dash:qa', QA.kind); qaDraw(true); }); });
    var f = box.querySelector('form');
    if (f) f.addEventListener('submit', function (e) {
      e.preventDefault();
      var src = S.data.sources, url = null;
      if (QA.kind === 'task') url = appLink(src.flow, { add: f.t.value.trim() });
      if (QA.kind === 'expense') {
        var a = parseFloat(f.a.value);
        if (!(a > 0)) { toast('Enter an amount'); return; }
        url = appLink(src.finance, { add: 'expense', amt: a.toFixed(2), desc: f.d.value.trim() });
      }
      if (QA.kind === 'fuel') url = appLink(src.garage, {}, 'add-fuel');

          '<div class="muted num" style="font-size:13px">' + rm(bud.spent, 0) + ' of ' + rm(bud.total, 0) + ' · ' + bud.pacePct + '% of the month gone</div>' +
          (!tover ? '<div class="faint num" style="font-size:12.5px">' + rm(bud.left / Math.max(1, daysLeftInMonth(d.today)), 0) + ' a day for the rest of the month</div>' : '') + '</div></div>';

        return '<button type="button" data-f="' + f[0] + '" aria-pressed="' + (S.filter === f[0]) + '">' + f[1] + '</button>';
      }).join('') + '</div><button type="button" class="icon-btn" id="recheck">' + svgIcon('refresh') + 'Recheck</button></div></div>';
    html += '<div class="grid g3" style="align-items:start">' + Object.keys(bySrc).map(function (k) {
      var list = bySrc[k];
      if (k === 'cross' && !list.length) return '';
      var body = list.length ? list.map(function (i, n) {
        var s = d.sources[i.source] || {};
        var link = i.ref && s.url ? s.url + '#gid=' + i.ref.gid + (i.ref.row ? '&range=' + i.ref.row + ':' + i.ref.row : '') : null;
        var linkLabel = i.ref && i.ref.row ? 'Open row ' + i.ref.row : 'Open tab';
        var fix = i.fix ? '<details class="fixbox"' + (n === 0 && i.level !== 'info' ? ' open' : '') + '><summary>How to fix <span class="where ' + esc(i.fix.where) + '">' + esc((WHERE[i.fix.where] || WHERE.none)(i)) + '</span></summary>' +
          '<ol>' + i.fix.steps.map(function (st) { return '<li>' + esc(st) + '</li>'; }).join('') + '</ol></details>' : '';
        return '<div class="issue' + (i.recovered ? ' rec' : '') + '"><span class="dot ' + (i.recovered ? 'ok' : i.level) + '"></span><div class="m"><span class="a">' + esc(i.area) + '</span>' + esc(i.message) + '</div>' +
          (i.detail ? '<div class="d">' + esc(i.detail) + '</div>' : '') + fix +
          '<div class="acts" style="margin-top:8px;align-items:center;flex-wrap:wrap">' + (i.fix && i.fix.where === 'app' ? appButton(s, true) : '') +
          (link ? '<a class="' + (i.fix && i.fix.where === 'app' && s.appUrl ? 'pill' : 'open-btn') + '" style="font-size:12.5px;padding:5px 11px" href="' + esc(link) + '" target="_blank" rel="noopener">' + linkLabel + ' ↗</a>' : '') +
          '<button type="button" class="linkbtn faint" data-hide="' + esc(issueKey(i)) + '" title="Hide on this device (for problems you have accepted)">Hide</button></div></div>';
      }).join('') : '<div class="good" style="font-size:14px;padding:6px 0">✓ Nothing to fix</div>';
      return '<div class="card">' + cardHead(SRC_LABEL[k] || k, list.length ? plural(list.length, 'item') : '', freshBadge(d.sources[k])) + body +
        '<div class="chip-row" style="margin-top:12px">' + appButton(d.sources[k]) + '</div></div>';
    }).join('') + '</div>';
    if (hiddenCount) html += '<div class="faint" style="font-size:13px;margin-top:12px">' + plural(hiddenCount, 'problem') + ' hidden · <button type="button" class="linkbtn" id="unhide">Show them again</button></div>';
    host.innerHTML = html;

    each(host, '.seg-ctl button', function (b) {
      b.addEventListener('click', function () { S.filter = b.getAttribute('data-f'); viewHealth(host, d); bindAppLinks(host); });
    });
    each(host, '[data-hide]', function (b) {
      b.addEventListener('click', function () {
        S.hidden[b.getAttribute('data-hide')] = Date.now();
        lsSet(LS.hidden, JSON.stringify(S.hidden));
        renderNav(); viewHealth(host, d); bindAppLinks(host);
        toast('Hidden on this device');
      });
    });
    $('recheck').addEventListener('click', recheck);
    if ($('unhide')) $('unhide').addEventListener('click', function () { S.hidden = {}; lsSet(LS.hidden, '{}'); renderNav(); viewHealth(host, d); bindAppLinks(host); });
  }

  /* Recheck: re-read the Sheets now and say what cleared. */
  function recheck() {
    if (!S.data) return;
    S.recheckFrom = {};
    S.data.issues.forEach(function (i) { S.recheckFrom[issueKey(i)] = i; });
    toast('Rechecking your Sheets…', 60000);
    load(true);
  }
  function reportRecheck() {
    var before = S.recheckFrom; S.recheckFrom = null;
    var now = {};
    S.data.issues.forEach(function (i) { if (!i.recovered) now[issueKey(i)] = 1; });
    var fixed = Object.keys(before).filter(function (k) { return !before[k].recovered && !now[k]; });
    var left = visibleIssues(S.data).filter(function (i) { return i.level !== 'info'; }).length;
    toast(fixed.length ? '✓ ' + plural(fixed.length, 'problem') + ' cleared · ' + left + ' left to fix' : 'Nothing new cleared yet · ' + left + ' left to fix. Changes made in an app show up after it syncs.', 5000);
  }
  var toastTimer;
  function toast(msg, ms) {
    var t = $('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('on'); }, ms || 2500);
  }

  function renderFooter(d) {
    var parts = Object.keys(d.sources).map(function (k) {
      var s = d.sources[k];
      return '<span><span class="dot ' + (s.ok ? 'ok' : 'error') + '" style="margin-right:5px"></span>' +
        (s.url ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + ' sheet</a>' : esc(s.name)) +
        (s.appUrl ? ' · <a href="' + esc(s.appUrl) + '" target="_blank" rel="noopener">app</a>' : '') + ' <span class="num">' + s.ms + 'ms</span></span>';
    });
    parts.push('<span>Read-only · v' + esc(d.version) + '</span>');
    if (window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches) parts.push('<span>Keys: <span class="kbd">1</span>–<span class="kbd">' + VIEWS.length + '</span> tabs · <span class="kbd">R</span> refresh</span>');
    if (MODE === 'remote' || MODE === 'gas') parts.push('<button type="button" class="linkbtn faint" data-reconnect>Connection settings</button>');
    each(document, '.foot', function (f) { f.innerHTML = parts.join(''); });
    each(document, '[data-reconnect]', function (b) { b.addEventListener('click', function () { showSetup(''); }); });
  }

  /* =========================================================
   * Theme, events, start
   * ======================================================= */
  function currentTheme() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t;
    return window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function paintThemeBtn() { $('theme').innerHTML = svgIcon(currentTheme() === 'dark' ? 'sun' : 'moon'); }
  var savedTheme = lsGet(LS.theme);
  if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
  paintThemeBtn();
  $('theme').addEventListener('click', function () {
    var next = currentTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    lsSet(LS.theme, next);
    paintThemeBtn();
    if (S.data) { S.animate = false; renderView(); }
  });
  $('refresh').addEventListener('click', function () { load(true); });

  var rz, lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (window.innerWidth === lastW) return; // ignore mobile toolbar height changes
    lastW = window.innerWidth;
    clearTimeout(rz);
    rz = setTimeout(function () { if (S.data) { S.animate = false; renderView(); } else pager.scrollLeft = viewIndex(S.view) * pageWidth(); }, 150);
  });
  window.addEventListener('online', function () { if (S.data && MODE !== 'setup') load(false); });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && Date.now() - S.loadedAt > 10 * 60e3) load(false);
  });

  // Back / forward and #links switch tabs
  function fromAddress() {
    var v = (location.hash || '').replace('#', '');
    if (v && v !== S.view && VIEWS.some(function (x) { return x.key === v; })) go(v, { fromHistory: true });
  }
  window.addEventListener('popstate', fromAddress);
  window.addEventListener('hashchange', fromAddress);

  // PC: keyboard shortcuts
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || /input|textarea|select/i.test((e.target.tagName || ''))) return;
    if (MODE === 'setup' || MODE === 'setup-gas') return;
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= VIEWS.length) { go(VIEWS[n - 1].key); e.preventDefault(); }
    else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !(e.target.closest && e.target.closest('.chart'))) {
      var to = viewIndex(S.view) + (e.key === 'ArrowRight' ? 1 : -1);
      if (to >= 0 && to < VIEWS.length) { go(VIEWS[to].key); e.preventDefault(); }
    }
    else if (e.key === 'r' || e.key === 'R') { load(true); e.preventDefault(); }
    else if (e.key === 'n' || e.key === 'N') { qaOpen(); e.preventDefault(); }
  });

  // Home-screen app: pull down to refresh (iOS has no built-in one there)
  (function () {
    if (!isStandalone() || !('ontouchstart' in window)) return;
    var startY = null, dy = 0, ptr = $('ptr');
    document.addEventListener('touchstart', function (e) { startY = activeScrollTop() <= 0 && e.touches.length === 1 && !(e.target.closest && e.target.closest('.chart')) ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
    document.addEventListener('touchmove', function (e) {
      if (startY === null) return;
      dy = Math.max(0, e.touches[0].clientY - startY);
      ptr.style.transform = 'translate(-50%, ' + (Math.min(dy, 110) - 60) + 'px) rotate(' + dy * 3 + 'deg)';
    }, { passive: true });
    document.addEventListener('touchend', function () {
      if (startY === null) return;
      startY = null;
      if (dy > 80 && MODE !== 'setup') {
        ptr.classList.add('spin'); ptr.style.transform = 'translate(-50%, 24px)';
        onLoaded = function () { ptr.classList.remove('spin'); ptr.style.transform = ''; };
        load(true);
      } else ptr.style.transform = '';
    });
  })();

  // Home-screen app: keep working offline (shows the last saved data)
  if (MODE === 'remote' || MODE === 'setup') {
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* optional */ });
    }
  }

  var startView = (location.hash || '').replace('#', '');
  S.view = VIEWS.some(function (v) { return v.key === startView; }) ? startView : 'overview';
  renderNav();
  setActive(S.view, { fromHistory: true });
  pager.scrollLeft = viewIndex(S.view) * pageWidth();
  if (MODE === 'setup' || MODE === 'setup-gas') { showSetup(''); return; }
  try {
    var saved = lsGet(LS.data);
    if (saved) { S.data = JSON.parse(saved); S.stale = true; render(); }
  } catch (e) { S.data = null; }
  load(false);
})();
</script>
</body>
</html>
